/* ============ CARA PAKAI ============
 OBS / TikTok LIVE Studio -> Add Source -> Browser Source -> Local file
 Width 1080, Height 1920. Taruh di layer paling atas. Latar transparan.
 Preview di browser: tambahkan ?bg=1 di alamat. Ganti username sosmed, judul tengah & tema di CONFIG (bawah).
 Gambar avatar sudah tertanam di file ini (tidak perlu file lain).
 ==================================== */
:root{--c1:#19b8ff;--c2:#2f5bff;--c3:#9ff4ff;--panel:rgba(3,9,28,.80);--ink:#eaf9ff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:transparent}
body.bg{background:repeating-conic-gradient(#10151f 0 25%,#1b2230 0 50%) 0 0/40px 40px}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;font-family:'Rajdhani','Segoe UI',sans-serif;color:var(--ink)}
.abs{position:absolute}
svg.frame{position:absolute;inset:0;width:1080px;height:1920px}
.glow{filter:drop-shadow(0 0 8px var(--c1)) drop-shadow(0 0 22px var(--c2))}
.run{stroke-dasharray:90 910;animation:run 5s linear infinite}
@keyframes run{to{stroke-dashoffset:-1000}}
.pulse{animation:pulse 2.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.75}50%{opacity:1}}

.w{position:absolute;filter:drop-shadow(0 0 10px var(--c1))}
.plate{--cut:28px;position:absolute;inset:0;background:linear-gradient(135deg,var(--c3),var(--c1) 40%,var(--c2));
 clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
.plate>.in{position:absolute;inset:4px;background:var(--panel);overflow:hidden;
 clip-path:polygon(calc(var(--cut) - 3px) 0,100% 0,100% calc(100% - var(--cut) + 3px),calc(100% - var(--cut) + 3px) 100%,0 100%,0 calc(var(--cut) - 3px))}

const q = new URLSearchParams(location.search);
const C = CONFIG, $ = id => document.getElementById(id);
const th = THEMES[q.get("theme") || C.theme] || THEMES.blue;
for (const k in th) document.documentElement.style.setProperty("--" + k, th[k]);
if (q.get("bg")) document.body.classList.add("bg");

$("sList").innerHTML = C.socials.slice(0,3).map(s =>
  '<div class="soc"><svg class="ic" viewBox="0 0 24 24">'+(ICONS[s.type]||"")+'</svg><div><div class="sl">'+s.label+'</div><div class="sn">'+s.handle+'</div></div></div>').join("");

$("dTitle").textContent = C.donorTitle;

function fit(){
  const s = Math.min(innerWidth / 1080, innerHeight / 1920);
  $("stage").style.transform = "scale(" + s + ")";
}
addEventListener("resize", fit); fit();
