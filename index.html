<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay TikTok LIVE - Portrait 1080x1920</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
/* ============ TEMA WARNA ============ */
:root{ /* default: biru */
  --y1:#6ec6ff; --y2:#c9eaff; --y3:#f0f9ff;
  --ink:#0b2a4a; --shadow:#2f8fd6; --glow:#6ec6ff;
  --bar1:#1e90ff; --bar2:#6ec6ff; --white:#fff;
}
:root[data-theme="yellow"]{--y1:#ffe94d;--y2:#fff3a0;--y3:#fffbe0;--ink:#3b2a00;--shadow:#e0a800;--glow:#ffe94d;--bar1:#ff9f1c;--bar2:#ffbf4d}
:root[data-theme="blue"]  {--y1:#6ec6ff;--y2:#c9eaff;--y3:#f0f9ff;--ink:#0b2a4a;--shadow:#2f8fd6;--glow:#6ec6ff;--bar1:#1e90ff;--bar2:#6ec6ff}
:root[data-theme="purple"]{--y1:#b794ff;--y2:#e2d4ff;--y3:#f6f0ff;--ink:#2a0a4a;--shadow:#7a4fd6;--glow:#b794ff;--bar1:#8a4dff;--bar2:#c4a3ff}
:root[data-theme="green"] {--y1:#7be495;--y2:#c9f5d5;--y3:#f0fff4;--ink:#0a3a1c;--shadow:#2fa65a;--glow:#7be495;--bar1:#1fbf5b;--bar2:#7be495}
:root[data-theme="red"]   {--y1:#ff6b6b;--y2:#ffc2c2;--y3:#fff0f0;--ink:#4a0a0a;--shadow:#d63a3a;--glow:#ff6b6b;--bar1:#e02d2d;--bar2:#ff8f8f}

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:transparent;overflow:hidden;
  font-family:'Baloo 2','Lilita One',system-ui,sans-serif}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;transform-origin:0 0}

/* ============ PANEL ATAS & BAWAH ============ */
.panel{position:absolute;left:0;width:1080px;overflow:hidden;
  background:
   radial-gradient(circle at 12% 20%,#fff 0 60px,transparent 62px),
   radial-gradient(circle at 92% 12%,#fff8 0 90px,transparent 92px),
   linear-gradient(160deg,var(--y2),var(--y1));}
.panel::before{content:"";position:absolute;inset:-100px;
  background-image:radial-gradient(#fff9 3px,transparent 4px);
  background-size:46px 46px;animation:dots 12s linear infinite;opacity:.7}
@keyframes dots{to{transform:translate(46px,46px)}}
#top{top:0;height:520px;border-bottom:6px solid #fff;box-shadow:0 0 30px var(--glow)}
#bottom{bottom:0;height:560px;border-top:6px solid #fff;box-shadow:0 0 30px var(--glow)}

/* ============ KARAKTER (ganti dengan PNG transparan) ============ */
.char{position:absolute;display:flex;align-items:center;justify-content:center;
  font-size:300px;filter:drop-shadow(0 12px 0 rgba(0,0,0,.15))}
.char img{width:100%;height:100%;object-fit:contain;object-position:50% 0}
#charTop{left:70px;top:14px;width:330px;height:760px;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite}
#charBot{right:50px;bottom:6px;width:260px;height:540px;transform-origin:50% 100%;animation:hop 1.6s ease-in-out infinite}
.char img{filter:drop-shadow(0 10px 0 rgba(11,42,74,.18))}
@keyframes sway{0%,100%{transform:rotate(-1.5deg) translateY(0)}50%{transform:rotate(1.5deg) translateY(-8px)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}45%{transform:translateY(-26px) scale(.98,1.03)}55%{transform:translateY(-26px) scale(.98,1.03)}}

/* ============ TEKS ============ */
.title{font-family:'Lilita One';color:var(--y1);font-size:68px;letter-spacing:2px;
  -webkit-text-stroke:10px var(--white);paint-order:stroke fill;text-shadow:0 6px 0 var(--shadow)}
.pill{background:linear-gradient(var(--y3),var(--y1));border:6px solid #fff;border-radius:42px;
  box-shadow:0 8px 0 var(--shadow),0 0 28px #fff8;color:#fff}

/* ============ INFO MAP ============ */
#map{position:absolute;left:520px;top:50px;width:520px}
#map .title{font-size:72px;display:block;margin-bottom:6px}
#mapName{display:block;text-align:center;font-family:'Lilita One';font-size:64px;
  padding:14px 10px;color:#fff;-webkit-text-stroke:8px var(--ink);paint-order:stroke fill;
  white-space:nowrap;overflow:hidden;min-height:104px}

/* ============ MILESTONE ============ */
#milestone{position:absolute;left:520px;top:300px;width:520px;background:#fff;
  border:5px solid #fff;border-radius:14px;box-shadow:0 8px 0 var(--shadow)}
#milestone .head{background:var(--y1);font-family:'Lilita One';font-size:34px;color:#fff;
  -webkit-text-stroke:6px var(--ink);paint-order:stroke fill;padding:4px 16px}
#milestone .body{background:var(--y1);margin:8px;padding:14px 18px;text-align:center;
  font-weight:800;color:var(--ink)}
#milestone .head{min-height:52px}
#milestone .body{min-height:150px}
#msTitle,.bar,#msText{display:none} /* isi milestone disembunyikan, hapus baris ini untuk menampilkan lagi */
#msTitle{font-size:28px;margin-bottom:10px}
.bar{height:28px;border:3px solid var(--ink);border-radius:20px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%;width:0%;border-radius:20px;
  background:repeating-linear-gradient(45deg,var(--bar1) 0 18px,var(--bar2) 18px 36px);
  background-size:52px 52px;animation:stripe 1s linear infinite;
  transition:width 1.2s cubic-bezier(.2,.9,.3,1)}
@keyframes stripe{to{background-position:52px 0}}
#msText{font-size:24px;margin-top:10px}

/* ============ USERNAME & TIKTOK ============ */
#usn{position:absolute;left:40px;top:90px;padding:18px 34px;min-width:760px;min-height:130px}
#usn span{font-family:'Lilita One';font-size:84px;color:var(--y1);
  -webkit-text-stroke:12px #fff;paint-order:stroke fill;text-shadow:0 6px 0 var(--shadow)}
#usn small{margin-right:10px;font-size:70px}
#usn b{font-weight:400}
#tt{position:absolute;left:40px;bottom:40px;display:flex;align-items:center;gap:20px;
  padding:14px 36px 14px 18px;width:560px}
#tt .logo{font-size:64px;color:var(--ink);text-shadow:3px 3px 0 #ff2d55,-3px -3px 0 #25f4ee}
#tt b{font-family:'Lilita One';font-weight:400;font-size:58px;color:var(--ink);text-shadow:0 3px 0 #fff}

/* ============ MARQUEE ============ */
#marquee{position:absolute;left:0;bottom:560px;width:1080px;height:86px;overflow:hidden;
  background:linear-gradient(var(--y2),var(--y1));border-top:6px solid #fff;border-bottom:6px solid #fff;
  display:flex;align-items:center}
#marquee div{white-space:nowrap;font-family:'Lilita One';font-size:54px;color:var(--ink);
  text-shadow:0 3px 0 #fff;padding-left:1080px;animation:run 22s linear infinite}
@keyframes run{to{transform:translateX(-100%)}}

/* ============ SPARKLE ============ */
.sp{position:absolute;color:#fff;font-size:44px;text-shadow:0 0 14px var(--glow);
  animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{transform:scale(.4) rotate(90deg);opacity:.4}}

#top{animation:inTop .9s cubic-bezier(.2,1.2,.3,1) both}
#bottom{animation:inBot .9s .15s cubic-bezier(.2,1.2,.3,1) both}
@keyframes inTop{from{transform:translateY(-100%)}}
@keyframes inBot{from{transform:translateY(100%)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="stage">

  <section id="top" class="panel">
    <div class="char" id="charTop"><!-- <img src="karakter-atas.png"> --></div>
    <div id="map">
      <span class="title">MAP :</span>
      <div class="pill"><span id="mapName"></span></div>
    </div>
    <div id="milestone">
      <div class="head"></div>
      <div class="body">
        <div id="msTitle">BELI NAILONG HEHE</div>
        <div class="bar"><i id="msFill"></i></div>
        <div id="msText">0 / 500,000 (0%)</div>
      </div>
    </div>
    <span class="sp" style="left:790px;top:20px">✦</span>
    <span class="sp" style="left:470px;top:250px;animation-delay:.8s">✦</span>
  </section>

  <div id="marquee"><div id="marqueeText"></div></div>

  <section id="bottom" class="panel">
    <div id="usn" class="pill"><span><small>usn :</small><b id="usnText"></b></span></div>
    <div class="char" id="charBot"><!-- <img src="karakter-bawah.png"> --></div>
    <div id="tt" class="pill"><span class="logo">♪</span><b id="ttText"></b></div>
    <span class="sp" style="left:440px;top:260px;animation-delay:.4s">✦</span>
    <span class="sp" style="left:30px;top:30px;animation-delay:1.2s">✦</span>
  </section>

</div>

<script>
/* ============ KONFIGURASI ============ */
const CONFIG = {
  theme:     "blue",   // pink | yellow | blue | purple | green | red
  mapName:   "",   // isi nama map di sini
  milestone: { title: "BELI NAILONG HEHE", current: 0, goal: 500000 },
  username:  "",   // isi username di sini
  tiktok:    "",   // isi akun TikTok di sini
  marquee:   "SUPPORT LINK DI BIO | SUPPORT LIVE DENGAN GIFT & FOLLOW | ",
};
/* Bisa lewat URL: ?theme=blue&map=MOUNT%20ATIN&current=125000&goal=500000&usn=Nama&tt=akun */
const q = new URLSearchParams(location.search);
if (q.get("theme"))   CONFIG.theme = q.get("theme");
if (q.get("map"))     CONFIG.mapName = q.get("map");
if (q.get("title"))   CONFIG.milestone.title = q.get("title");
if (q.get("current")) CONFIG.milestone.current = +q.get("current");
if (q.get("goal"))    CONFIG.milestone.goal = +q.get("goal");
if (q.get("usn"))     CONFIG.username = q.get("usn");
if (q.get("tt"))      CONFIG.tiktok = q.get("tt");
if (q.get("text"))    CONFIG.marquee = q.get("text");

const $ = id => document.getElementById(id);
document.documentElement.dataset.theme = CONFIG.theme;
const fmt = n => n.toLocaleString("en-US");

function setMilestone(current, goal = CONFIG.milestone.goal){
  const pct = Math.max(0, Math.min(100, Math.floor(current / goal * 100)));
  $("msFill").style.width = pct + "%";
  $("msText").textContent = `${fmt(current)} / ${fmt(goal)} (${pct}%)`;
}
function setMapName(name){
  const el = $("mapName"); el.textContent = name;
  let s = 64; el.style.fontSize = s + "px";
  while (el.scrollWidth > el.clientWidth && s > 28){ s -= 2; el.style.fontSize = s + "px"; }
}
function fit(){
  const k = Math.min(innerWidth/1080, innerHeight/1920);
  $("stage").style.transform = `translate(${(innerWidth-1080*k)/2}px,${(innerHeight-1920*k)/2}px) scale(${k})`;
}
addEventListener("resize", fit);

$("msTitle").textContent = CONFIG.milestone.title;
$("usnText").textContent = CONFIG.username;
$("ttText").textContent  = CONFIG.tiktok;
$("marqueeText").textContent = CONFIG.marquee.repeat(3);
setMapName(CONFIG.mapName);
fit();
setTimeout(() => setMilestone(CONFIG.milestone.current), 600);
window.setMilestone = setMilestone;
window.setMapName = setMapName;
</script>
</body>
</html>
